<svg viewBox="0 0 960 610" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 18px; font-weight: 600; fill: #16211E; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; font-weight: 600; fill: #16211E; }
      .sublabel { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; fill: #4A5A55; }
      .box { fill: #FFFFFF; stroke: #D9E0DD; stroke-width: 1.5; }
      .box-faded { fill: #FFFFFF; stroke: #D9E0DD; stroke-width: 1.5; opacity: 0.6; }
      .box-teal { fill: #E1EFE9; stroke: #8FC4B2; stroke-width: 1.5; }
      .box-indigo { fill: #E7EAF4; stroke: #A9B6DC; stroke-width: 1.5; }
      .arrow { stroke: #0F6E56; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#0F6E56" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="480" y="35" text-anchor="middle" class="title">Compute &amp; Platform Placement — Tanpa VM Tambahan</text>

  <!-- Row 1: Bastion → SSM -->
  <rect x="60" y="70" width="180" height="50" class="box-faded" rx="4" />
  <text x="150" y="91" text-anchor="middle" class="label">Bastion host (SSH VM)</text>

  <line x1="260" y1="95" x2="350" y2="95" class="arrow" />

  <rect x="360" y="70" width="200" height="50" class="box-teal" rx="4" />
  <text x="460" y="91" text-anchor="middle" class="label">SSM Session Manager</text>
  <text x="460" y="109" text-anchor="middle" class="sublabel">Shell tanpa SSH publik, sesi terekam</text>

  <!-- Row 2: VPN → Zero Trust -->
  <rect x="60" y="160" width="180" height="60" class="box-faded" rx="4" />
  <text x="150" y="186" text-anchor="middle" class="label">VPN (semua staf/operator)</text>

  <line x1="260" y1="190" x2="350" y2="190" class="arrow" />

  <rect x="360" y="160" width="200" height="60" class="box-teal" rx="4" />
  <text x="460" y="186" text-anchor="middle" class="label">Cloudflare Zero Trust</text>
  <text x="460" y="204" text-anchor="middle" class="sublabel">Operator ≤50 orang; staf klinis via IdP+MFA</text>
  <text x="460" y="217" text-anchor="middle" class="sublabel">di Gateway Admin</text>

  <!-- Row 3: VM batch job → Kubernetes CronJob -->
  <rect x="60" y="250" width="180" height="50" class="box-faded" rx="4" />
  <text x="150" y="271" text-anchor="middle" class="label">VM batch job</text>

  <line x1="260" y1="275" x2="350" y2="275" class="arrow" />

  <rect x="360" y="250" width="200" height="50" class="box-teal" rx="4" />
  <text x="460" y="271" text-anchor="middle" class="label">Kubernetes CronJob</text>
  <text x="460" y="291" text-anchor="middle" class="sublabel">Concurrency limit per tenant</text>

  <!-- Row 4: CI Runner → SaaS -->
  <rect x="60" y="330" width="180" height="50" class="box-faded" rx="4" />
  <text x="150" y="351" text-anchor="middle" class="label">Runner CI self-hosted (EC2)</text>

  <line x1="260" y1="355" x2="350" y2="355" class="arrow" />

  <rect x="360" y="330" width="200" height="50" class="box-teal" rx="4" />
  <text x="460" y="351" text-anchor="middle" class="label">Runner CI SaaS</text>
  <text x="460" y="371" text-anchor="middle" class="sublabel">Build di luar VPC, image ditandatangani → ECR</text>

  <!-- Spec boxes: EKS and PgBouncer -->
  <rect x="60" y="410" width="280" height="140" class="box-indigo" rx="4" />
  <text x="200" y="433" text-anchor="middle" class="label">EKS</text>
  <text x="200" y="453" text-anchor="middle" class="sublabel">3 × m6i.xlarge (1/AZ)</text>
  <text x="200" y="470" text-anchor="middle" class="sublabel">Cluster Autoscaler → 6 node</text>
  <text x="200" y="487" text-anchor="middle" class="sublabel">HPA CPU + latency p95</text>
  <text x="200" y="504" text-anchor="middle" class="sublabel">load test 2× puncak</text>

  <rect x="380" y="410" width="280" height="140" class="box-indigo" rx="4" />
  <text x="520" y="433" text-anchor="middle" class="label">PgBouncer</text>
  <text x="520" y="453" text-anchor="middle" class="sublabel">2 replika · transaction pooling</text>
  <text x="520" y="470" text-anchor="middle" class="sublabel">anti-affinity lintas AZ</text>
  <text x="520" y="487" text-anchor="middle" class="sublabel">fail closed (tanpa fallback ke RDS)</text>

</svg>
