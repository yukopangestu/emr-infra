<svg viewBox="0 0 960 792" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16px; font-weight: 600; fill: #16211E; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; fill: #16211E; }
      .sublabel { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; fill: #4A5A55; }
      .zone-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; font-weight: 600; fill: #0F6E56; }
      .box { fill: #FFFFFF; stroke: #D9E0DD; stroke-width: 1; }
      .box-teal { fill: #E1EFE9; stroke: #8FC4B2; stroke-width: 1.5; }
      .box-indigo { fill: #E7EAF4; stroke: #A9B6DC; stroke-width: 1.5; }
      .box-clay { fill: #F5E7E2; stroke: #DCAE9E; stroke-width: 1.5; }
      .zone-border { stroke: #D9E0DD; stroke-width: 2; stroke-dasharray: 4,2; fill: none; }
      .arrow { stroke: #0F6E56; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
      .line { stroke: #D9E0DD; stroke-width: 1; fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#0F6E56" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="480" y="30" text-anchor="middle" class="title">Master Architecture Diagram</text>

  <!-- ============ USERS LAYER ============ -->
  <rect x="50" y="60" width="160" height="50" class="box" rx="4" />
  <text x="130" y="82" text-anchor="middle" class="label">Pasien &amp;</text>
  <text x="130" y="100" text-anchor="middle" class="label">Mobile App</text>

  <rect x="250" y="60" width="160" height="50" class="box" rx="4" />
  <text x="330" y="82" text-anchor="middle" class="label">Staf Fasilitas</text>
  <text x="330" y="100" text-anchor="middle" class="label">Kesehatan</text>

  <!-- Arrows from users to Cloudflare -->
  <line x1="130" y1="110" x2="130" y2="140" class="arrow" />
  <line x1="330" y1="110" x2="330" y2="140" class="arrow" />

  <!-- ============ CLOUDFLARE EDGE ============ -->
  <rect x="20" y="140" width="600" height="40" class="box-teal" rx="4" />
  <text x="50" y="162" class="zone-label">Cloudflare Edge</text>
  <text x="450" y="162" class="sublabel">DNS, DDoS Protection, Cache</text>

  <!-- Arrows from Cloudflare to AWS -->
  <line x1="130" y1="180" x2="130" y2="210" class="arrow" />
  <line x1="330" y1="180" x2="330" y2="210" class="arrow" />

  <!-- ============ AWS EDGE ============ -->
  <rect x="20" y="210" width="600" height="40" class="box-teal" rx="4" />
  <text x="50" y="232" class="zone-label">AWS Edge</text>
  <text x="450" y="232" class="sublabel">Route 53, CloudFront</text>

  <!-- Arrows from AWS Edge to ALBs -->
  <line x1="130" y1="250" x2="130" y2="280" class="arrow" />
  <line x1="330" y1="250" x2="330" y2="280" class="arrow" />

  <!-- ============ VPC ZONE ============ -->
  <rect x="20" y="280" width="600" height="440" class="zone-border" rx="4" />
  <text x="40" y="298" class="zone-label">AWS VPC</text>

  <!-- PUBLIC SUBNETS -->
  <rect x="40" y="310" width="280" height="110" class="zone-border" rx="3" />
  <text x="60" y="327" class="sublabel">Public Subnets (us-east-1a, 1b, 1c)</text>

  <rect x="60" y="335" width="120" height="35" class="box" rx="3" />
  <text x="120" y="355" text-anchor="middle" class="label">ALB Public</text>

  <rect x="200" y="335" width="110" height="35" class="box" rx="3" />
  <text x="255" y="355" text-anchor="middle" class="label">ALB Admin</text>

  <!-- NAT Gateways -->
  <circle cx="95" cy="395" r="12" fill="#FFFFFF" stroke="#D9E0DD" stroke-width="1" />
  <text x="95" y="399" text-anchor="middle" class="sublabel">NAT</text>

  <circle cx="175" cy="395" r="12" fill="#FFFFFF" stroke="#D9E0DD" stroke-width="1" />
  <text x="175" y="399" text-anchor="middle" class="sublabel">NAT</text>

  <circle cx="255" cy="395" r="12" fill="#FFFFFF" stroke="#D9E0DD" stroke-width="1" />
  <text x="255" y="399" text-anchor="middle" class="sublabel">NAT</text>

  <!-- Arrows from ALBs to services -->
  <line x1="120" y1="370" x2="120" y2="430" class="line" />
  <line x1="255" y1="370" x2="255" y2="430" class="line" />

  <!-- PRIVATE APP SUBNETS - EKS -->
  <rect x="40" y="430" width="280" height="150" class="zone-border" rx="3" />
  <text x="60" y="447" class="sublabel">Private App Subnets (EKS Nodes)</text>

  <!-- Gateway services -->
  <rect x="60" y="455" width="100" height="30" class="box-indigo" rx="3" />
  <text x="110" y="472" text-anchor="middle" class="label">Gateway Pub</text>

  <rect x="180" y="455" width="100" height="30" class="box-indigo" rx="3" />
  <text x="230" y="472" text-anchor="middle" class="label">Gateway Adm</text>

  <!-- Service boxes -->
  <rect x="60" y="495" width="48" height="30" class="box" rx="3" />
  <text x="84" y="512" text-anchor="middle" class="sublabel">Patient</text>

  <rect x="118" y="495" width="48" height="30" class="box" rx="3" />
  <text x="142" y="512" text-anchor="middle" class="sublabel">Encounter</text>

  <rect x="176" y="495" width="48" height="30" class="box" rx="3" />
  <text x="200" y="512" text-anchor="middle" class="sublabel">Order</text>

  <rect x="234" y="495" width="48" height="30" class="box" rx="3" />
  <text x="258" y="512" text-anchor="middle" class="sublabel">Result</text>

  <rect x="60" y="535" width="48" height="30" class="box" rx="3" />
  <text x="84" y="552" text-anchor="middle" class="sublabel">Identity</text>

  <rect x="118" y="535" width="48" height="30" class="box" rx="3" />
  <text x="142" y="552" text-anchor="middle" class="sublabel">Tenant</text>

  <rect x="176" y="535" width="48" height="30" class="box" rx="3" />
  <text x="200" y="552" text-anchor="middle" class="sublabel">Billing</text>

  <rect x="234" y="535" width="48" height="30" class="box" rx="3" />
  <text x="258" y="552" text-anchor="middle" class="sublabel">Audit</text>

  <!-- PRIVATE DATA SUBNETS -->
  <rect x="40" y="590" width="280" height="120" class="zone-border" rx="3" />
  <text x="60" y="607" class="sublabel">Private Data Subnets</text>

  <rect x="60" y="625" width="90" height="35" class="box" rx="3" />
  <text x="105" y="645" text-anchor="middle" class="label">PgBouncer</text>

  <rect x="170" y="625" width="130" height="35" class="box" rx="3" />
  <text x="235" y="645" text-anchor="middle" class="label">RDS PostgreSQL</text>

  <!-- Secondary components -->
  <circle cx="80" cy="685" r="12" fill="#FFFFFF" stroke="#D9E0DD" stroke-width="1" />
  <text x="80" y="689" text-anchor="middle" class="sublabel" font-size="9">Read</text>

  <circle cx="140" cy="685" r="12" fill="#FFFFFF" stroke="#D9E0DD" stroke-width="1" />
  <text x="140" y="689" text-anchor="middle" class="sublabel" font-size="9">Cache</text>

  <circle cx="200" cy="685" r="12" fill="#FFFFFF" stroke="#D9E0DD" stroke-width="1" />
  <text x="200" y="689" text-anchor="middle" class="sublabel" font-size="9">MQ</text>

  <!-- ============ PLATFORM SERVICES (Right Column) ============ -->
  <!-- Platform Services header -->
  <rect x="350" y="310" width="250" height="100" class="zone-border" rx="4" />
  <text x="370" y="327" class="sublabel">Platform Services</text>

  <rect x="370" y="340" width="80" height="30" class="box-indigo" rx="3" />
  <text x="410" y="357" text-anchor="middle" class="label">S3</text>

  <rect x="470" y="340" width="80" height="30" class="box-indigo" rx="3" />
  <text x="510" y="357" text-anchor="middle" class="label">KMS</text>

  <rect x="370" y="380" width="80" height="30" class="box-indigo" rx="3" />
  <text x="410" y="397" text-anchor="middle" class="sublabel">Secrets Mgr</text>

  <rect x="470" y="380" width="80" height="30" class="box-indigo" rx="3" />
  <text x="510" y="397" text-anchor="middle" class="sublabel">Observability</text>

  <!-- DR Region -->
  <rect x="350" y="425" width="250" height="75" class="zone-border" rx="4" />
  <text x="370" y="442" class="sublabel">DR Region (us-west-2)</text>

  <rect x="370" y="450" width="110" height="30" class="box-clay" rx="3" />
  <text x="425" y="467" text-anchor="middle" class="sublabel">RDS Replica</text>

  <rect x="500" y="450" width="80" height="30" class="box-clay" rx="3" />
  <text x="540" y="467" text-anchor="middle" class="sublabel">S3 Repl</text>

  <!-- External Integrations -->
  <rect x="350" y="515" width="250" height="75" class="zone-border" rx="4" />
  <text x="370" y="532" class="sublabel">External Integrations</text>

  <rect x="370" y="545" width="100" height="30" class="box-clay" rx="3" />
  <text x="420" y="562" text-anchor="middle" class="sublabel">SATUSEHAT</text>

  <rect x="490" y="545" width="80" height="30" class="box-clay" rx="3" />
  <text x="530" y="562" text-anchor="middle" class="sublabel">BPJS</text>

  <!-- Connection lines from services to data layer -->
  <line x1="175" y1="565" x2="175" y2="590" class="line" />

  <!-- Return arrows from data to services -->
  <line x1="105" y1="625" x2="105" y2="570" class="arrow" />

  <!-- Right column connections -->
  <line x1="320" y1="460" x2="350" y2="460" class="line" />
  <line x1="320" y1="555" x2="350" y2="555" class="line" />

</svg>